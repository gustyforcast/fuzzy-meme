# Runs on PRs into main (build+test verification) and on version tags
# (full archive + TestFlight upload). This is the expensive job — macOS
# runner minutes cost ~10x Linux, see docs/01-tool-stack-and-costs.md —
# so it's deliberately NOT wired to run on every push.
#
# Requires these repo secrets for the release job (tag pushes only):
#   BUILD_CERTIFICATE_BASE64      — .p12 signing cert, base64-encoded
#   P12_PASSWORD                  — password for the .p12
#   BUILD_PROVISION_PROFILE_BASE64 — .mobileprovision, base64-encoded
#   KEYCHAIN_PASSWORD             — any throwaway password for the CI keychain
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_BASE64  — App Store Connect API .p8 key, base64-encoded
#
# SCHEME is Verso-Mac, not a generic single scheme — this repo's project.yml
# defines two targets/schemes (Verso-Mac, Verso-iOS) because docs/ROADMAP.md
# is explicit that Phase 1 is Mac-first. This job builds/tests the Mac
# scheme against a macOS destination; add a parallel Verso-iOS job (Simulator
# destination) once Phase 2 (iPhone/iPad) actually starts — don't build it
# out early, per docs/ROADMAP.md's phase gating.
#
# Uses XcodeGen (see project.yml) rather than a committed .xcodeproj, so
# `xcodegen generate` runs as a CI step below.

name: Build & TestFlight (macOS)

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"

env:
  SCHEME: Verso-Mac
  PROJECT: Verso.xcodeproj

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build for testing (macOS)
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS"

      - name: Run tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      # NOTE: --type ios / the .ipa extension below are wrong for a Mac
      # app and left as a known gap — this release job hasn't been
      # exercised for Verso-Mac yet (no signing secrets configured, no
      # tag pushed). Fix this (macos type, .pkg/.app export, and a Mac
      # App Store or Developer ID ExportOptions.plist) before the first
      # real tag push. Tracked implicitly by not having removed this
      # note — don't let it go stale.
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          xcrun altool --upload-app \
            --type macos \
            --file "$RUNNER_TEMP/export/$SCHEME.pkg" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
